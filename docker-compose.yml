services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: my_personal_web
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: my_personal_web
    ports:
      - '5432:5432'

  backend:
    build: ./backend
    working_dir: /app
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    environment:
      DATABASE_URL: postgresql+asyncpg://my_personal_web:changeme@postgres:5432/my_personal_web
    ports:
      - '8000:8000'
    depends_on:
      - postgres

  worker:
    build: ./backend
    working_dir: /app
    command: uv run python -m app.infrastructure.queue.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://my_personal_web:changeme@postgres:5432/my_personal_web
    depends_on:
      - postgres

  frontend:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "corepack enable && pnpm install && pnpm dev --port 3000"
    ports:
      - '3000:3000'
    depends_on:
      - backend
